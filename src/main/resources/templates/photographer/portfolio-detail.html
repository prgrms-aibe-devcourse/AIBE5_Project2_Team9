<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layouts/default :: layout(~{::title}, ~{::pageStyles}, ~{::main})}">
<head>
  <title th:fragment="title" th:text="${portfolioName} + ' | PICKASSO'">포트폴리오 상세 | PICKASSO</title>
  <th:block th:fragment="pageStyles"></th:block>
</head>
<body>

<main th:fragment="main" class="bg-[#F9FAFC] min-h-screen">

  <!-- ── 상단 헤더 바 ──────────────────────────────── -->
  <div class="border-b border-[#CCC] bg-white">
    <div class="max-w-[1440px] mx-auto px-6 py-4 flex items-center gap-4">
      <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
         class="inline-flex items-center gap-1.5 text-sm text-[#888] hover:text-[#1D3CFF] transition-colors no-underline flex-shrink-0">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        돌아가기
      </a>
      <div class="h-4 w-px bg-[#CCC]"></div>
      <h1 class="text-base font-bold text-[#1A1A1A] truncate" th:text="${portfolioName}">포트폴리오 제목</h1>
    </div>
  </div>

  <!-- ── 본문 ────────────────────────────────────── -->
  <div class="max-w-[1440px] mx-auto px-6 py-8 flex flex-col lg:flex-row gap-8 items-start">

    <!-- ── 갤러리 영역 ─────────────────────────────── -->
    <div class="flex-1 min-w-0">

      <!-- 포트폴리오 제목 -->
      <h2 class="text-2xl font-bold text-[#1A1A1A] mb-6" th:text="${portfolioName}">포트폴리오 제목</h2>

      <!-- 이미지 갤러리 그리드 (준비 중 플레이스홀더) -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <!-- 메인 이미지 자리 (큰 셀) -->
        <div class="col-span-2 row-span-2 bg-[#D3DEF2] rounded-2xl aspect-[4/3] flex flex-col items-center justify-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-[#888]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
          </svg>
          <p class="text-sm text-[#888]">이미지 준비 중</p>
        </div>
        <!-- 서브 이미지 자리들 -->
        <div class="bg-[#D3DEF2] rounded-2xl aspect-square"></div>
        <div class="bg-[#D3DEF2] rounded-2xl aspect-square"></div>
        <!-- 추가 행 -->
        <div class="bg-[#D3DEF2] rounded-2xl aspect-square"></div>
        <div class="bg-[#D3DEF2] rounded-2xl aspect-square"></div>
        <div class="bg-[#D3DEF2] rounded-2xl aspect-square"></div>
      </div>

    </div>
    <!-- ── 갤러리 영역 끝 ──────────────────────────── -->

    <!-- ── 사이드바 ────────────────────────────────── -->
    <aside class="w-full lg:w-[320px] flex-shrink-0 lg:sticky lg:top-6 flex flex-col gap-4">

      <!-- 작가 카드 -->
      <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
         class="flex items-center gap-3 bg-white border border-[#CCC] rounded-2xl px-4 py-4 no-underline hover:border-[#0097FF] transition-colors group">
        <div class="w-12 h-12 rounded-full bg-[#D3DEF2] overflow-hidden flex-shrink-0 flex items-center justify-center">
          <img th:if="${photographerImgUrl != null and !#strings.isEmpty(photographerImgUrl)}"
               th:src="${photographerImgUrl}"
               alt="작가 프로필"
               class="w-full h-full object-cover" loading="lazy">
          <svg th:unless="${photographerImgUrl != null and !#strings.isEmpty(photographerImgUrl)}"
               xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#AAA]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-[#1A1A1A] group-hover:text-[#0097FF] transition-colors truncate"
             th:text="${photographerNickname}">작가 이름</p>
          <div class="flex items-center gap-1 mt-0.5">
            <th:block th:with="rating=${photographerRating}">
              <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                <svg th:if="${i <= rating}" class="w-3 h-3 text-[#0097FF]" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 0 0 .95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 0 0-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 0 0-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 0 0-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 0 0 .951-.69l1.07-3.292Z"/>
                </svg>
                <svg th:unless="${i <= rating}" class="w-3 h-3 text-[#CCC]" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 0 0 .95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 0 0-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 0 0-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 0 0-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 0 0 .951-.69l1.07-3.292Z"/>
                </svg>
              </th:block>
            </th:block>
            <span class="text-xs text-[#888]">·</span>
            <span class="text-xs text-[#888]" th:text="'후기 ' + ${photographerReviewCount} + '개'"></span>
          </div>
        </div>
        <svg class="w-4 h-4 text-[#888] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <!-- 포트폴리오 설명 -->
      <div class="bg-white border border-[#CCC] rounded-2xl px-5 py-5">
        <p class="text-xs font-bold text-[#888] uppercase tracking-wide mb-2">포트폴리오 설명</p>
        <p class="text-sm text-[#444] leading-relaxed whitespace-pre-line"
           th:text="${portfolioDescription}">포트폴리오 설명이 여기에 표시됩니다.</p>
      </div>

      <!-- 카테고리 & 프로젝트 종류 -->
      <div class="bg-white border border-[#CCC] rounded-2xl px-5 py-5 flex flex-col gap-4">
        <div>
          <p class="text-xs font-bold text-[#888] uppercase tracking-wide mb-2">카테고리</p>
          <div class="flex flex-wrap gap-2">
            <span th:if="${portfolioTagNames == null or portfolioTagNames.isEmpty()}"
                  class="bg-[#F9FAFC] text-[#AAA] text-xs px-3 py-1 rounded-full border border-[#CCC]">준비 중</span>
            <span th:each="tagName : ${portfolioTagNames}"
                  class="bg-[#EEF4FF] text-[#1D3CFF] text-xs px-3 py-1 rounded-full border border-[#C9DAFF]"
                  th:text="${tagName}">태그</span>
          </div>
        </div>
        <div class="h-px bg-[#CCC]"></div>
        <div>
          <p class="text-xs font-bold text-[#888] uppercase tracking-wide mb-2">프로젝트 종류</p>
          <div class="flex flex-wrap gap-2">
            <span th:if="${portfolioProjectType == null}"
                  class="bg-[#F9FAFC] text-[#AAA] text-xs px-3 py-1 rounded-full border border-[#CCC]">준비 중</span>
            <span th:if="${portfolioProjectType != null}"
                  class="bg-[#EEF4FF] text-[#1D3CFF] text-xs px-3 py-1 rounded-full border border-[#C9DAFF]"
                  th:text="${portfolioProjectType.displayName}">개인</span>
          </div>
        </div>
      </div>

      <!-- 예약 버튼 -->
      <a th:href="@{/photographer/{id}/portfolio/{portfolioId}/edit(id=${photographerId}, portfolioId=${portfolioId})}"
         class="block w-full bg-white border border-[#CCC] text-[#444] font-bold py-3.5 rounded-xl text-[15px] hover:border-[#1D3CFF] hover:text-[#1D3CFF] transition-colors text-center no-underline">
        포트폴리오 수정하기
      </a>

      <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
         class="block w-full bg-white border border-[#1D3CFF] text-[#1D3CFF] font-bold py-3.5 rounded-xl text-[15px] hover:bg-[#1D3CFF] hover:text-white active:bg-[#1530E0] active:border-[#1530E0] transition-colors text-center no-underline">
        이 작가에게 예약하기
      </a>

    </aside>
    <!-- ── 사이드바 끝 ──────────────────────────────── -->

  </div>

</main>

</body>
</html>
