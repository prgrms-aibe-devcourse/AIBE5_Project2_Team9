<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layouts/default :: layout(~{::title}, ~{::pageStyles}, ~{::main})}">
<head>
  <title th:fragment="title" th:text="${portfolioName} + ' | PICKASSO'">포트폴리오 상세 | PICKASSO</title>
  <th:block th:fragment="pageStyles"></th:block>
</head>
<body>

<main th:fragment="main" class="bg-[#F9FAFC] min-h-screen py-10">
  <div class="max-w-[1216px] mx-auto px-6">

    <!-- 뒤로가기 -->
    <div class="mb-6">
      <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
         class="inline-flex items-center gap-2 text-sm text-[#888] hover:text-[#1D3CFF] transition-colors no-underline">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        작가 프로필로 돌아가기
      </a>
    </div>

    <!-- 본문 카드 (좌우 패널) -->
    <div class="bg-white border border-[#CCC] rounded-2xl overflow-hidden flex flex-col lg:flex-row shadow-sm"
         style="min-height: 640px;">

      <!-- ── 왼쪽 패널 ───────────────────────────────── -->
      <div class="w-full lg:w-[360px] flex-shrink-0 flex flex-col border-b lg:border-b-0 lg:border-r border-[#CCC] p-8">

        <!-- 제목 -->
        <h1 class="text-xl font-bold text-[#1A1A1A] leading-snug mb-5"
            th:text="${portfolioName}">포트폴리오 제목</h1>

        <!-- 작가 미니 카드 -->
        <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
           class="flex items-center gap-3 bg-[#F9FAFC] border border-[#CCC] rounded-xl px-4 py-3 mb-5 no-underline hover:border-[#0097FF] transition-colors group">
          <!-- 프로필 이미지 -->
          <div class="w-11 h-11 rounded-full bg-[#D3DEF2] overflow-hidden flex-shrink-0 flex items-center justify-center">
            <img th:if="${photographerImgUrl != null and !#strings.isEmpty(photographerImgUrl)}"
                 th:src="${photographerImgUrl}"
                 alt="작가 프로필"
                 class="w-full h-full object-cover" loading="lazy">
            <svg th:unless="${photographerImgUrl != null and !#strings.isEmpty(photographerImgUrl)}"
                 xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#AAA]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-[#1A1A1A] group-hover:text-[#0097FF] transition-colors truncate"
               th:text="${photographerNickname}">작가 이름</p>
            <div class="flex items-center gap-1 mt-0.5">
              <!-- 별점 (5개) -->
              <th:block th:with="rating=${photographerRating}">
                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                  <svg th:if="${i <= rating}" class="w-3 h-3 text-[#0097FF]" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 0 0 .95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 0 0-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 0 0-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 0 0-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 0 0 .951-.69l1.07-3.292Z"/>
                  </svg>
                  <svg th:unless="${i <= rating}" class="w-3 h-3 text-[#CCC]" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 0 0 .95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 0 0-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 0 0-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 0 0-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 0 0 .951-.69l1.07-3.292Z"/>
                  </svg>
                </th:block>
              </th:block>
              <span class="text-xs text-[#888]">·</span>
              <span class="text-xs text-[#888]" th:text="'후기 ' + ${photographerReviewCount} + '개'"></span>
            </div>
          </div>
          <svg class="w-4 h-4 text-[#888] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </a>

        <div class="h-px bg-[#CCC] mb-5"></div>

        <!-- 포트폴리오 설명 -->
        <div class="mb-5">
          <p class="text-sm font-bold text-[#1A1A1A] mb-2">포트폴리오 설명</p>
          <p class="text-sm text-[#444] leading-relaxed whitespace-pre-line"
             th:text="${portfolioDescription}">포트폴리오 설명이 여기에 표시됩니다.</p>
        </div>

        <!-- 카테고리 (준비 중) -->
        <div class="mb-5">
          <p class="text-sm font-bold text-[#1A1A1A] mb-2">카테고리</p>
          <div class="flex flex-wrap gap-2">
            <span class="bg-[#F9FAFC] text-[#AAA] text-sm px-4 py-1.5 rounded-full border border-[#CCC]">준비 중</span>
          </div>
        </div>

        <!-- 프로젝트 종류 (준비 중) -->
        <div class="mb-5">
          <p class="text-sm font-bold text-[#1A1A1A] mb-2">프로젝트 종류</p>
          <div class="flex flex-wrap gap-2">
            <span class="bg-[#F9FAFC] text-[#AAA] text-sm px-4 py-1.5 rounded-full border border-[#CCC]">준비 중</span>
          </div>
        </div>

        <!-- 예약 버튼 -->
        <div class="mt-auto pt-6">
          <a th:href="@{/photographer/{id}/profile(id=${photographerId})}"
             class="block w-full bg-white border border-[#1D3CFF] text-[#1D3CFF] font-bold py-3.5 rounded-xl text-[15px] hover:bg-[#1D3CFF] hover:text-white active:bg-[#1530E0] active:border-[#1530E0] transition-colors text-center no-underline">
            이 작가에게 예약하기
          </a>
        </div>

      </div>
      <!-- ── 왼쪽 패널 끝 ──────────────────────────── -->

      <!-- ── 오른쪽 패널 (이미지 갤러리 - 준비 중) ──── -->
      <div class="flex-1 bg-[#F9FAFC] flex flex-col items-center justify-center gap-4 p-12 text-center min-h-[400px]">
        <div class="w-16 h-16 rounded-full bg-[#D3DEF2] flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#888]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-[#444] mb-1">등록된 이미지가 없습니다</p>
          <p class="text-xs text-[#888]">이미지 업로드 기능은 준비 중입니다</p>
        </div>
      </div>
      <!-- ── 오른쪽 패널 끝 ──────────────────────────── -->

    </div>
  </div>
</main>

</body>
</html>
