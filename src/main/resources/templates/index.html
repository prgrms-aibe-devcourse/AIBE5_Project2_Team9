<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(~{::title}, ~{::pageStyles}, ~{::main})}">
<head>
  <title>PICKASSO - 소중한 순간, 색감 있는 작가를 만나보세요</title>
  <th:block th:fragment="pageStyles">
    <style>
        /* 작가 카드 썸네일 그라디언트 플레이스홀더 */
        .thumb-grad-1  { background: linear-gradient(135deg, #c9d6df, #e2ebf0); }
        .thumb-grad-2  { background: linear-gradient(135deg, #a8c5a0, #c8dfc5); }
        .thumb-grad-3  { background: linear-gradient(135deg, #b8c8d8, #d5e0ea); }
        .thumb-grad-4  { background: linear-gradient(135deg, #d4c5b8, #e8ddd5); }
        .thumb-grad-5  { background: linear-gradient(135deg, #c5b8cc, #ddd5e8); }
        .thumb-grad-6  { background: linear-gradient(135deg, #b8c5c8, #d5e0e2); }
        .thumb-grad-7  { background: linear-gradient(135deg, #c8c5a0, #e2dfbb); }
        .thumb-grad-8  { background: linear-gradient(135deg, #c5c8b8, #dfe2d5); }
        .thumb-grad-9  { background: linear-gradient(135deg, #b8c8c5, #d5e2e0); }
        .thumb-grad-10 { background: linear-gradient(135deg, #c8b8c5, #e2d5df); }
        /* CTA 작가 카드 썸네일 */
        .cta-card-thumb { background: linear-gradient(135deg, #b8c8d8 0%, #c5d5e5 50%, #d5e5f5 100%); }
        /* 날짜 스트립 스크롤바 숨김 */
        .date-strip::-webkit-scrollbar { display: none; }
        /* 날짜 아이템 공통 스타일 + 상태 */
        .date-item {
            flex-shrink: 0; width: 2.75rem; height: 2.75rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px; font-size: 0.875rem; font-weight: 500;
            color: #444; cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .date-item:hover { background: #D3DEF2; color: #1D3CFF; }
        .date-item.today { background: #1D3CFF; color: #fff; font-weight: 700; }
        /* 카테고리 태그 공통 스타일 + 활성 상태 */
        .cat-tag {
            font-size: 0.8125rem; font-weight: 500; color: #444;
            background: #F9FAFC; border: 1.5px solid #CCC; border-radius: 20px;
            padding: 6px 16px; cursor: pointer; transition: all 0.15s;
        }
        .cat-tag:hover, .cat-tag.active { background: #1D3CFF; border-color: #1D3CFF; color: #fff; }
    </style>
    <link rel="stylesheet" th:href="@{/css/score_items.css}">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('search-form').addEventListener('submit', function(e) {
                e.preventDefault();

                const inputs = this.querySelectorAll('input[type="hidden"]');
                inputs.forEach(input => {
                    if (!input.value) {
                        input.disabled = true; // disabled된 input은 전송 안됨
                    }
                });

                const itemType = document.getElementById('display-item-type');
                itemType.disabled = !itemType.value;

                this.submit();
            });

            const region = document.getElementById('h-region').value;
            if (region) {
                document.getElementById('clear-region-btn').classList.remove('hidden');
            }
        });
        function clearRegion() {
            event.stopPropagation(); // ← 부모로 이벤트 전파 차단
            document.getElementById("h-region").value = "";
            document.getElementById("h-lat").value = "";
            document.getElementById("h-lng").value = "";
            document.getElementById("display-region").textContent = "지역선택";
            document.getElementById('clear-region-btn').classList.add('hidden');
        }
    </script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=66fd58e49ef902c79dbaa2577ceb31d2&libraries=services&autoload=false"></script>

    <script src="/js/score_items.js"></script>
  </th:block>
</head>
<body>
<main>

  <!-- ═══════════════════════════════════════════
       HERO
  ════════════════════════════════════════════ -->
  <section class="h-[480px] bg-[#D3DEF2] flex flex-col items-center justify-center gap-7 px-6">
    <h1 class="font-[500] text-[38px] text-[#1A1A1A] text-center tracking-tight leading-[1.3]">
      소중한 순간, 색감 있는 작가를 만나보세요
    </h1>

    <!-- 검색 바 (AI 추천 포함 한 줄) -->
    <form id="search-form" method="get" th:action="@{/search}" th:object="${itemSearchFormDto}">
      <!-- hidden inputs -->
      <input type="hidden" id="h-region"   th:field="*{address}" />
      <input type="hidden" id="h-lat"      th:field="*{lat}" />
      <input type="hidden" id="h-lng"      th:field="*{lng}" />
      <input type="hidden" id="h-category" th:field="*{tag}" />
      <input type="hidden" id="h-date"     th:field="*{date}" />
      <input type="hidden" th:field="*{orderBy}" />
      <!-- 검색바 -->
      <div class="bg-white rounded-[50px] flex items-center w-full shadow-[0_8px_32px_rgba(0,0,0,0.18)] pl-5 pr-1.5 py-1.5">

        <!-- 지역 -->
        <div onclick="locationModal.open()"
             class="flex items-center gap-2 px-4 py-1.5 flex-1 min-w-[200px] border-r border-[#E8E8E8] cursor-pointer hover:text-[#1D3CFF] transition-colors">
          <svg class="text-[#0097FF] shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="display-region" class="text-sm flex-1 text-center text-[#555] whitespace-nowrap"
                th:text="${param.region} ?: '지역선택'"></span>
          <button type="button"
                  id="clear-region-btn"
                  onclick="clearRegion(event)"
                  class="hidden text-[#AAA] hover:text-[#FF3B3B] transition-colors bg-transparent border-0 cursor-pointer shrink-0 p-0">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- 촬영유형 -->
        <div onclick="categoryModal.open()"
             class="flex items-center gap-2 px-4 py-1.5 flex-1 min-w-[200px] border-r border-[#E8E8E8] cursor-pointer hover:text-[#1D3CFF] transition-colors">
          <svg class="text-[#0097FF] shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="display-category" class="text-sm flex-1 text-center text-[#555] whitespace-nowrap"
                th:text="${param.category} ?: '촬영유형'"></span>
        </div>

        <!-- 날짜 -->
        <div onclick="dateModal.open()"
             class="flex items-center gap-2 px-4 py-1.5 flex-1 min-w-[200px] border-r border-[#E8E8E8] cursor-pointer hover:text-[#1D3CFF] transition-colors">
          <svg class="text-[#0097FF] shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span id="display-date" class="text-sm flex-1 text-center text-[#555] whitespace-nowrap"
                th:text="${param.date} ?: '날짜'"></span>
        </div>
        <!-- 촬영 방식 -->
        <div class="flex items-center gap-2 px-4 py-1.5 flex-1 min-w-[200px] border-r border-[#E8E8E8]">
          <svg class="text-[#0097FF] shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
          <div class="flex flex-1">
            <select id="display-item-type"
                    th:field="*{itemType}"
                    class="appearance-none text-sm flex-1 text-center text-[#555] bg-transparent border-0 outline-none cursor-pointer">
              <option value="">촬영방식</option>
              <option value="IN">스튜디오</option>
              <option value="OUT">출장촬영</option>
            </select>
          </div>
        </div>
        <!-- 검색 버튼 -->
        <button type="submit"
                class="p-2 mx-1 text-[#888] hover:text-[#1D3CFF] transition-colors shrink-0 bg-transparent border-0"
                aria-label="검색">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>

        <!-- AI PICK -->
        <a th:href="@{/ai-pick}"
           class="inline-flex items-center gap-1.5 bg-[#1D3CFF] text-white text-sm font-bold rounded-[50px] px-[18px] py-2.5 hover:bg-[#1530E0] transition-colors no-underline shrink-0">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H4a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-1"/>
          </svg>
          AI PICK
        </a>
      </div>
    </form>
    <!-- 모달 (form 밖) -->
    <th:block th:replace="~{fragments/modal/location-modal :: locationModal(${favoriteList})}" />
    <th:block th:replace="~{fragments/modal/category-modal :: categoryModal(${tagList})}" />
    <th:block th:replace="~{fragments/modal/date-modal :: dateModal}" />
    <!--    <th:block th:replace="~{fragments/component/search-form :: searchForm(${itemSearchFormDto}, ${favoritList}, ${tagList})}" />-->

  </section>

  <!-- ═══════════════════════════════════════════
       CALENDAR + FILTER + PHOTO GRID
  ════════════════════════════════════════════ -->
  <section class="pt-8 bg-[#F9FAFC]">
    <div class="max-w-[1216px] mx-auto px-6">

      <!-- 별점순 추천 섹션 -->
      <div style="padding: 2rem 0 1rem;">

        <div class="section-label">인기 작가</div>
        <h2 class="section-title">별점순 추천</h2>
        <p class="section-sub">지금 가장 사랑받는 작가들을 만나보세요</p>

        <!-- 태그 필터 -->
        <div class="tag-row" id="tagRow">
          <span class="tag active" data-tag="">전체</span>
          <span th:each="tag : ${tagList}"
                class="tag"
                th:data-tag="${tag.name}"
                th:text="${tag.name}">
          </span>
        </div>

        <!-- 별점순 카드 그리드 (fragment 교체 대상) -->
        <div id="scoreGrid">
          <div th:replace="~{fragments/score_items :: scoreGrid}"></div>
        </div>

        <hr class="divider">

        <!-- 커스텀 큐레이션 섹션 -->
        <div class="custom-label">이달의 큐레이션</div>
        <h2 class="custom-title"
            th:text="${customItemName != null && !#strings.isEmpty(customItemName)}
               ? ${customItemName}
               : ${#dates.format(#dates.createNow(), 'M') + '월 추천 매칭'}">
          4월 추천 매칭
        </h2>
        <p class="custom-sub">편집팀이 직접 선별한 이달의 작가</p>

        <!-- 커스텀 카드 그리드 -->
        <div class="card-grid">
          <th:block th:if="${#lists.isEmpty(customItemList)}">
            <div class="empty-state">
              <p class="empty-text">준비 중입니다</p>
            </div>
          </th:block>
          <th:block th:unless="${#lists.isEmpty(customItemList)}"
                    th:each="item : ${customItemList}">
            <a th:href="@{/item/{id}(id=${item.id})}" class="card">
              <div class="card-img-wrap">
                <img class="card-img"
                     th:src="${item.imgUrl != null ? item.imgUrl : 'https://picsum.photos/seed/' + item.id + '/400/533'}"
                     th:alt="${item.name}"
                     loading="lazy"
                     th:onerror="'this.src=\'https://picsum.photos/seed/' + ${item.id} + '/400/533\''">
                <!-- <span class="badge">NEW</span> 필요 시 조건 추가 -->
              </div>
              <div class="card-body">
                <!-- 상품명 -->
                <p class="card-item-name" th:text="${item.name}"></p>
                <!-- 작가명 -->
                <p class="card-name" th:text="${item.photographer.name}"></p>
                <!-- 지역 · 태그 -->
                <p class="card-meta" th:text="${item.region.address + ' · ' + item.tag.name}"></p>
                <div class="card-footer">
                  <div class="score">
                    <span class="star">★</span>
                    <span th:text="${#numbers.formatDecimal(item.reviewScore * 1.0 / item.reviewCount, 1, 2)}"></span>
                    <span class="review-count" th:text="'(' + ${item.reviewCount} + ')'"></span>
                  </div>
                  <span class="price" th:text="${#numbers.formatInteger(item.defaultPrice, 3, 'COMMA') + '원~'}"></span>
                </div>
              </div>
            </a>
          </th:block>
        </div>

      </div>
    </div>
  </section>

  <hr class="border-0 border-t border-[#CCC]">

  <!-- ═══════════════════════════════════════════
       FEATURES
  ════════════════════════════════════════════ -->
  <section class="bg-white border-b border-[#CCC] py-16">
    <div class="max-w-[900px] mx-auto px-6 text-center">
      <h2 class="text-[24px] font-bold text-[#1A1A1A] mb-12">
        Pick 하고, <span class="text-[#1D3CFF]">Pick</span> 해주는 서비스
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

        <!-- 작가 검색 -->
        <div class="flex flex-col items-center gap-3 text-center">
          <div class="w-[72px] h-[72px] bg-[#F9FAFC] rounded-[20px] flex items-center justify-center text-[30px] transition-transform duration-200 hover:scale-110">
            🔍
          </div>
          <div class="text-[15px] font-bold text-[#1A1A1A]">쉽게 검색하고</div>
          <div class="text-[13px] text-[#888] leading-relaxed">검색을 통해 원하는<br>감성의 작가를 찾을 수 있습니다.</div>
        </div>

        <!-- 간편 확인 -->
        <div class="flex flex-col items-center gap-3 text-center">
          <div class="w-[72px] h-[72px] bg-[#F9FAFC] rounded-[20px] flex items-center justify-center text-[30px] transition-transform duration-200 hover:scale-110">
            📋
          </div>
          <div class="text-[15px] font-bold text-[#1A1A1A]">간편하게 확인하고</div>
          <div class="text-[13px] text-[#888] leading-relaxed">예약 내역과 진행 상황을<br>한눈에 확인할 수 있습니다</div>
        </div>

        <!-- AI 추천 -->
        <div class="flex flex-col items-center gap-3 text-center">
          <div class="w-[72px] h-[72px] bg-[#F9FAFC] rounded-[20px] flex items-center justify-center text-[30px] transition-transform duration-200 hover:scale-110">
            🤖
          </div>
          <div class="text-[15px] font-bold text-[#1A1A1A]">AI가 추천하고</div>
          <div class="text-[13px] text-[#888] leading-relaxed">AI가 작가를<br>빠르게 찾아드립니다.</div>
        </div>

        <!-- 사진 확인 -->
        <div class="flex flex-col items-center gap-3 text-center">
          <div class="w-[72px] h-[72px] bg-[#F9FAFC] rounded-[20px] flex items-center justify-center text-[30px] transition-transform duration-200 hover:scale-110">
            📸
          </div>
          <div class="text-[15px] font-bold text-[#1A1A1A]">사진으로 확인하고</div>
          <div class="text-[13px] text-[#888] leading-relaxed">작가의 스타일과 분위기를<br>미리 경험해보세요.</div>
        </div>

      </div>
    </div>
  </section>

<script>
    // 카테고리 태그 토글
    document.querySelectorAll('.cat-tag').forEach(tag => {
        tag.addEventListener('click', () => {
            document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
        });
    });

    // 날짜 선택
    document.querySelectorAll('.date-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.date-item').forEach(d => d.classList.remove('today'));
            item.classList.add('today');
        });
    });
</script>
