<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PICKASSO - 소중한 순간, 색감 있는 작가를 만나보세요</title>

  <link rel="stylesheet" th:href="@{/css/global.css}">

  <style>
    @keyframes fragFloat {
      0%   { opacity: 0; transform: translateY(20px) rotate(0deg); }
      20%  { opacity: 0.12; }
      80%  { opacity: 0.07; }
      100% { opacity: 0; transform: translateY(-30px) rotate(12deg); }
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes shutterSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes letterIn {
      from { opacity: 0; transform: translateY(24px); color: #1A1A1A; }
      to   { opacity: 1; transform: translateY(0);    color: #1D3CFF; }
    }
    @keyframes assoIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 패럴랙스 래퍼: 위치 담당, JS가 transform 적용 */
    .frag-wrap {
      position: absolute;
      will-change: transform;
    }
    .frag-wrap:nth-child(1) { top: 10%; left: 5%; }
    .frag-wrap:nth-child(2) { top: 20%; right: 8%; }
    .frag-wrap:nth-child(3) { top: 70%; left: 10%; }
    .frag-wrap:nth-child(4) { top: 60%; right: 5%; }
    .frag-wrap:nth-child(5) { top: 85%; left: 40%; }
    .frag-wrap:nth-child(6) { top: 5%;  left: 50%; }
    .frag-wrap:nth-child(7) { top: 40%; left: 2%; }
    .frag-wrap:nth-child(8) { top: 30%; right: 2%; }

    /* 파편: 색상·크기·float 애니메이션만 담당 */
    .frag {
      border-radius: 2px;
      opacity: 0;
      animation: fragFloat 6s ease-in-out infinite;
    }
    .frag-wrap:nth-child(1) .frag { width: 80px; height: 60px; background: #E8C84B; animation-delay: 0s; }
    .frag-wrap:nth-child(2) .frag { width: 50px; height: 90px; background: #4A9ECC; animation-delay: 1.2s; }
    .frag-wrap:nth-child(3) .frag { width: 70px; height: 40px; background: #CC4444; animation-delay: 2s; }
    .frag-wrap:nth-child(4) .frag { width: 40px; height: 70px; background: #6BAD6B; animation-delay: 0.8s; }
    .frag-wrap:nth-child(5) .frag { width: 90px; height: 30px; background: #C4773A; animation-delay: 1.8s; }
    .frag-wrap:nth-child(6) .frag { width: 30px; height: 80px; background: #9B6B9B; animation-delay: 3s; }
    .frag-wrap:nth-child(7) .frag { width: 60px; height: 60px; background: #4A9ECC; animation-delay: 2.5s; }
    .frag-wrap:nth-child(8) .frag { width: 45px; height: 55px; background: #E8C84B; animation-delay: 0.4s; }

    .logo-anim { animation: logoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .pick-letter {
      display: inline-block;
      color: #1D3CFF;
      animation: letterIn 0.45s calc(0.3s + var(--i) * 0.13s) cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .asso-span {
      display: inline-block;
      color: #1A1A1A;
      animation: assoIn 0.6s 0.95s ease both;
    }
    .fade-up-1 { animation: fadeUp 0.8s 0.6s ease both; }
    .fade-up-2 { animation: fadeUp 0.6s 0.9s ease both; }
    .fade-up-3 { animation: fadeUp 0.8s 1.0s ease both; }
    .fade-up-4 { animation: fadeUp 0.8s 1.3s ease both; }

    .shutter-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: shutterSpin 3s linear infinite;
      background:
        linear-gradient(#F9FAFC, #F9FAFC) padding-box,
        conic-gradient(from 0deg, #E8C84B, #CC4444, #4A9ECC, #6BAD6B, #C4773A, #9B6B9B, #E8C84B) border-box;
    }

    .btn-pick {
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.15s;
    }

  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            angelica: ['WhiteAngelica', 'cursive'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-[#F9FAFC] font-sans overflow-hidden">

<div class="min-h-screen flex flex-col items-center justify-center relative px-8 py-8">

  <!-- 배경 컬러 파편 -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="frag-wrap" data-depth="0.06"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.03"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.07"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.02"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.05"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.08"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.04"><div class="frag"></div></div>
    <div class="frag-wrap" data-depth="0.03"><div class="frag"></div></div>
  </div>

  <!-- 히어로 -->
  <div class="flex flex-col items-center z-10">

    <!-- 로고 -->
    <div class="logo-anim relative w-[140px] h-[140px]">
      <div class="shutter-ring"></div>
      <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="PICKKASSO 로고"
           class="w-full h-full object-contain relative z-10"
           onerror="this.style.display='none'" loading="lazy" />
    </div>

    <!-- 브랜드 네임 -->
    <div class="font-angelica leading-none mt-6 tracking-[-2px] text-[clamp(52px,10vw,88px)]">
      <span class="pick-letter" style="--i:0">P</span><span class="pick-letter" style="--i:1">I</span><span class="pick-letter" style="--i:2">C</span><span class="pick-letter" style="--i:3">K</span><span class="asso-span">ASSO</span>
    </div>

    <!-- 태그라인 -->
    <p class="fade-up-1 text-[10px] tracking-[4px] text-[#888] uppercase mt-14">
      피카소
    </p>

    <!-- 구분선 -->
    <div class="fade-up-2 w-px h-12 my-8 bg-gradient-to-b from-transparent via-[#1D3CFF] to-transparent"></div>

    <!-- CTA 영역 -->
    <div class="fade-up-3 flex flex-col items-center gap-4">
      <p class="text-[clamp(16px,3vw,22px)] text-[#444] text-center max-w-[440px] leading-[1.5] font-normal">
        당신만의 <span class="text-[#1D3CFF] font-medium">예술적 순간</span>을 포착할<br>
        완벽한 작가를 만나보세요
      </p>

      <div class="flex gap-3 mt-2 flex-wrap justify-center">
        <a th:href="@{/home}" href="/home"
           class="btn-pick inline-block bg-[#1D3CFF] text-white text-[13px] font-bold tracking-wide
                  px-8 py-3.5 no-underline hover:bg-[#1530E0]">
          둘러보기 ↗
        </a>
      </div>
    </div>

    <!-- 통계 -->
    <div class="fade-up-4 flex gap-8 mt-14">
      <div class="flex flex-col items-center gap-1">
        <span class="text-2xl font-bold text-[#1A1A1A]">2,400<span class="text-[#1D3CFF]">+</span></span>
        <span class="text-[10px] tracking-[2px] text-[#AAA] uppercase">등록 작가</span>
      </div>
      <div class="w-px bg-[#CCC] self-stretch"></div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-2xl font-bold text-[#1A1A1A]">18<span class="text-[#1D3CFF]">k</span></span>
        <span class="text-[10px] tracking-[2px] text-[#AAA] uppercase">완료 촬영</span>
      </div>
      <div class="w-px bg-[#CCC] self-stretch"></div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-2xl font-bold text-[#1A1A1A]">4.9<span class="text-[#0097FF]">★</span></span>
        <span class="text-[10px] tracking-[2px] text-[#AAA] uppercase">평균 평점</span>
      </div>
    </div>

  </div>
</div>


<script>
  // ── 마우스 패럴랙스 ──────────────────────────────────────────
  const wraps = document.querySelectorAll('.frag-wrap');
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;

  window.addEventListener('mousemove', e => {
    targetX = e.clientX - window.innerWidth / 2;
    targetY = e.clientY - window.innerHeight / 2;
  });

  function tick() {
    currentX += (targetX - currentX) * 0.08;
    currentY += (targetY - currentY) * 0.08;

    wraps.forEach(wrap => {
      const depth = parseFloat(wrap.dataset.depth);
      wrap.style.transform = `translate(${currentX * depth}px, ${currentY * depth}px)`;
    });

    requestAnimationFrame(tick);
  }
  tick();

  // ── 마그네틱 버튼 ────────────────────────────────────────────
  const btn = document.querySelector('.btn-pick');

  btn.addEventListener('mousemove', e => {
    const rect = btn.getBoundingClientRect();
    const dx = (e.clientX - (rect.left + rect.width / 2)) * 0.35;
    const dy = (e.clientY - (rect.top  + rect.height / 2)) * 0.35;
    btn.style.transform = `translate(${dx}px, ${dy}px)`;
  });

  btn.addEventListener('mouseleave', () => {
    btn.style.transform = 'translate(0, 0)';
  });

</script>

</body>
</html>
