<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="locationModal(favoriteList)">

  <div id="location-modal"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:12px; width:920px; padding:28px 28px 20px;">

      <h2 style="font-size:18px; font-weight:500; margin:0 0 20px;">위치 선택</h2>

      <!-- 탭 -->
      <div style="display:flex; border-bottom:1.5px solid #eee; margin-bottom:20px;">
        <button id="tab-direct" data-active="true"  type="button" onclick="locationModal.switchTab('direct')"
                class="modal-tab">직접 선택</button>
        <button id="tab-fav"    data-active="false" type="button" onclick="locationModal.switchTab('fav')"
                class="modal-tab">즐겨찾기</button>
      </div>

      <!-- 본문 -->
      <div style="display:flex; gap:16px; height:620px;">

        <!-- 지도 -->
        <div id="kakao-map" style="flex:0 0 460px; height:100%; border-radius:8px; overflow:hidden;"></div>

        <!-- 오른쪽 패널 wrapper -->
        <div style="flex:1; position:relative; display:flex; flex-direction:column;">

          <!-- 즐겨찾기 패널 -->
          <div id="panel-fav"    style="flex:1; display:none;  flex-direction:column; overflow-y:auto; gap:8px;">
          <div th:if="${favoriteList == null or #lists.isEmpty(favoriteList)}"
                 style="display:flex; align-items:center; justify-content:center; height:100%; color:#aaa; font-size:14px; text-align:center;">
              아직 저장된 즐겨찾기가 없습니다
            </div>
            <th:block th:unless="${favoriteList == null or #lists.isEmpty(favoriteList)}">
              <div th:each="fav : ${favoriteList}"
                   class="fav-item"
                   data-selected="false"
                   th:onclick="|locationModal.selectFavorite(this, ${fav.lat}, ${fav.lng}, '${fav.region}')|"
                   style="display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:8px; border:0.5px solid #eee; cursor:pointer;">
                <div style="width:36px; height:36px; border-radius:50%; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;">🏠</div>
                <div>
                  <p style="margin:0; font-size:14px; font-weight:500;" th:text="${fav.name}"></p>
                  <p style="margin:0; font-size:12px; color:#888;" th:text="${fav.region}"></p>
                </div>
              </div>
            </th:block>
          </div>

          <!-- 직접 선택 패널 -->
          <div id="panel-direct" style="flex:1; display:flex; flex-direction:column; gap:12px;">

            <!-- 위치 정보 카드 -->
            <div style="flex:1; border:1px solid #eee; border-radius:12px; padding:16px; display:flex; flex-direction:column; justify-content:center;">

              <!-- 안내 (선택 전) -->
              <div id="direct-empty" style="display:flex; flex-direction:column; align-items:center; gap:12px;">
                <p style="margin:0; color:#aaa; font-size:13px; text-align:center;">
                  지도를 클릭해서 위치를 선택하거나<br>주소로 검색하세요
                </p>
                <button type="button" onclick="locationModal.openPostcode()"
                        style="padding:8px 20px; background:#fff; border:1px solid #1D3CFF; color:#1D3CFF; border-radius:8px; font-size:13px; cursor:pointer;">
                  주소로 검색하기
                </button>
              </div>

              <!-- 선택 후 -->
              <div id="direct-filled" style="display:none; flex-direction:column; gap:4px;">
                <p style="font-size:12px; color:#888; margin:0 0 2px;">도로명 주소</p>
                <p id="direct-road"   style="font-size:14px; font-weight:500; margin:0 0 12px; color:#333;"></p>
                <p style="font-size:12px; color:#888; margin:0 0 2px;">지번 주소</p>
                <p id="direct-jibun"  style="font-size:13px; margin:0 0 12px; color:#555;"></p>
                <p style="font-size:12px; color:#888; margin:0 0 2px;">지역</p>
                <p id="direct-region" style="font-size:13px; margin:0 0 16px; color:#555;"></p>
                <button type="button" onclick="locationModal.openPostcode()"
                        style="width:100%; padding:8px; background:#fff; border:1px solid #ddd; color:#555; border-radius:8px; font-size:12px; cursor:pointer;">
                  다시 검색하기
                </button>
              </div>
            </div>

          </div>

          <!-- 우편번호 오버레이 (오른쪽 패널 기준 inset:0) -->
          <div id="postcode-overlay"
               style="display:none; position:absolute; inset:0; background:#fff; border-radius:12px; z-index:10; flex-direction:column; overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #eee; flex-shrink:0;">
              <span style="font-size:14px; font-weight:500;">주소 검색</span>
              <button type="button" onclick="locationModal.closePostcode()"
                      style="background:none; border:none; font-size:18px; color:#888; cursor:pointer; line-height:1;">&#x2715;</button>
            </div>
            <div id="postcode-wrap" style="flex:1; min-height:0; overflow:hidden;"></div>
          </div>

        </div>
      </div>

      <!-- 하단 버튼 -->
      <div style="border-top:1px solid #eee; margin-top:20px; padding-top:16px; display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" onclick="locationModal.close()"
                style="padding:8px 20px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer;">취소</button>
        <button type="button" id="btn-confirm-location" onclick="locationModal.confirm()"
                style="padding:8px 20px; background:#1D3CFF; color:#fff; border:none; border-radius:8px; opacity:0.4; cursor:default;" disabled>선택 완료</button>
      </div>

    </div>
  </div>

  <style>
      .modal-tab {
          background: none; border: none;
          border-bottom: 2.5px solid transparent;
          margin-bottom: -1.5px; padding: 0 4px 10px;
          margin-right: 20px; font-size: 14px; font-weight: 500;
          color: #888; cursor: pointer;
      }
      .modal-tab[data-active="true"] { border-bottom-color: #1D3CFF; color: #1D3CFF; }
      .fav-item[data-selected="true"] { border-color: #1D3CFF !important; border-width: 1.5px !important; background: #EEF2FF; }
      .search-result-item {
          display: flex; justify-content: space-between; align-items: center;
          padding: 8px 12px; cursor: pointer; font-size: 13px;
          border-bottom: 0.5px solid #f0f0f0;
      }
      .search-result-item:hover { background: #f8f9ff; }
      .result-type {
          font-size: 11px; color: #1D3CFF; background: #EEF2FF;
          padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
      }
      .search-result-empty { padding: 12px; text-align: center; color: #aaa; font-size: 13px; }
      .result-road {
          font-size: 13px;
          color: #333;
      }
      .result-jibun {
          font-size: 11px;
          color: #999;
      }
      .search-result-item {
          padding: 10px 12px;  /* 기존보다 세로 여백 살짝 늘림 */
      }
      .result-road  { font-size: 13px; color: #333; }
      .result-jibun { font-size: 11px; color: #999; }
      .search-result-item { padding: 10px 12px; border-bottom: 0.5px solid #f0f0f0; }
      .search-result-item:last-child { border-bottom: none; }
  </style>
  <script>
          kakao.maps.load(function () {

              const locationModal = {
                  selectedData: null,
                  map: null,
                  marker: null,

                  open() {
                      document.getElementById('location-modal').style.display = 'flex';
                      this.initMap();
                  },

                  close() {
                      document.getElementById('location-modal').style.display = 'none';
                  },

                  initMap() {
                      if (this.map) return;
                      const container = document.getElementById('kakao-map');
                      const options = {
                          center: new kakao.maps.LatLng(37.5665, 126.9780),
                          level: 5,
                      };
                      this.map = new kakao.maps.Map(container, options);
                      this.marker = new kakao.maps.Marker();

                      this.mapClickHandler = (mouseEvent) => {
                          const lat = mouseEvent.latLng.getLat();
                          const lng = mouseEvent.latLng.getLng();
                          this.selectByClick(lat, lng);
                      };

                      // ↓ 이 줄 추가: 초기 탭이 직접선택이므로 클릭 이벤트 바로 등록
                      kakao.maps.event.addListener(this.map, 'click', this.mapClickHandler);
                  },

                  selectByClick(lat, lng) {
                      // 마커 이동
                      const position = new kakao.maps.LatLng(lat, lng);
                      this.marker.setPosition(position);
                      this.marker.setMap(this.map);

                      // 좌표 → 주소 변환
                      const geocoder = new kakao.maps.services.Geocoder();
                      geocoder.coord2Address(lng, lat, (result, status) => {
                          if (status !== kakao.maps.services.Status.OK) return;

                          const road  = result[0].road_address?.address_name || '';
                          const jibun = result[0].address?.address_name || '';
                          const r     = result[0].address;
                          const region = [r?.region_1depth_name, r?.region_2depth_name, r?.region_3depth_name]
                              .filter(Boolean).join(' ');

                          document.getElementById('direct-empty').style.display  = 'none';
                          document.getElementById('direct-filled').style.display = 'block';
                          document.getElementById('direct-road').textContent     = road || jibun;
                          document.getElementById('direct-jibun').textContent    = jibun;
                          document.getElementById('direct-region').textContent   = region;

                          this.selectedData = { region, lat, lng };
                          this.setConfirmEnabled(true);
                      });
                  },

                  openPostcode() {
                      const overlay = document.getElementById('postcode-overlay');
                      const wrap    = document.getElementById('postcode-wrap');
                      overlay.style.display = 'flex';
                      wrap.innerHTML = '';

                      new daum.Postcode({
                          width: '100%',
                          height: '100%',
                          oncomplete: (data) => {
                              const fullAddress = data.roadAddress || data.jibunAddress;
                              const region = [data.sido, data.sigungu, data.bname]
                                  .filter(Boolean).join(' ');

                              const geocoder = new kakao.maps.services.Geocoder();
                              geocoder.addressSearch(fullAddress, (result, status) => {
                                  if (status !== kakao.maps.services.Status.OK) return;

                                  const lat = parseFloat(result[0].y);
                                  const lng = parseFloat(result[0].x);

                                  // 주소 정보 표시
                                  document.getElementById('direct-empty').style.display  = 'none';
                                  document.getElementById('direct-filled').style.display = 'block';
                                  document.getElementById('direct-road').textContent     = data.roadAddress || '';
                                  document.getElementById('direct-jibun').textContent    = data.jibunAddress || '';
                                  document.getElementById('direct-region').textContent   = region;

                                  this.selectedData = { region, lat, lng };
                                  this.moveMap(lat, lng);
                                  this.setConfirmEnabled(true);

                                  // 우편번호 창 닫기
                                  this.closePostcode();
                              });
                          }
                      }).embed(wrap);
                  },

                  closePostcode() {
                      document.getElementById('postcode-overlay').style.display = 'none';
                      document.getElementById('postcode-wrap').innerHTML = '';
                  },


                  switchTab(tab) {
                      const tabs = ['fav', 'direct'];
                      tabs.forEach(t => {
                          document.getElementById(`tab-${t}`).dataset.active = (t === tab) ? 'true' : 'false';
                          document.getElementById(`panel-${t}`).style.display = (t === tab) ? 'flex' : 'none';
                      });

                      if (tab === 'direct') {
                          setTimeout(() => kakao.maps.event.trigger(this.map, 'resize'), 0);
                          // 클릭 이벤트 활성화
                          this.map.setDraggable(true);
                          kakao.maps.event.addListener(this.map, 'click', this.mapClickHandler);
                      } else {
                          // 즐겨찾기: 클릭 이벤트 비활성화
                          kakao.maps.event.removeListener(this.map, 'click', this.mapClickHandler);
                      }
                  },

                  embedPostcode() {
                      const wrap = document.getElementById('postcode-wrap');
                      wrap.innerHTML = '';

                      new daum.Postcode({
                          width: '100%',
                          height: '100%',
                          oncomplete: (data) => {
                              const fullAddress = data.roadAddress || data.jibunAddress;
                              const region = [data.sido, data.sigungu, data.bname]
                                  .filter(Boolean).join(' ');

                              const geocoder = new kakao.maps.services.Geocoder();
                              geocoder.addressSearch(fullAddress, (result, status) => {
                                  if (status !== kakao.maps.services.Status.OK) {
                                      alert('좌표 변환에 실패했습니다.');
                                      return;
                                  }

                                  const lat = parseFloat(result[0].y);
                                  const lng = parseFloat(result[0].x);

                                  this.selectedData = { region, lat, lng };
                                  this.moveMap(lat, lng);
                                  this.setConfirmEnabled(true);

                                  // 선택된 주소 표시 오버레이
                                  this.showSelectedAddress(fullAddress, region);
                              });
                          }
                      }).embed(wrap);
                  },

                  showSelectedAddress(addr, region) {
                      const wrap = document.getElementById('postcode-wrap');

                      // 기존 오버레이 제거
                      const existing = document.getElementById('postcode-selected');
                      if (existing) existing.remove();

                      // 선택된 주소 배너 + 재검색 버튼
                      const overlay = document.createElement('div');
                      overlay.id = 'postcode-selected';
                      overlay.style.cssText = `
        position: absolute; top: 0; left: 0; right: 0;
        background: #EEF2FF; border-bottom: 1px solid #1D3CFF;
        padding: 10px 14px; display: flex; align-items: center;
        justify-content: space-between; z-index: 10;
    `;
                      overlay.innerHTML = `
        <div>
            <p style="margin:0; font-size:12px; color:#1D3CFF; font-weight:500;">선택된 주소</p>
            <p style="margin:0; font-size:13px; color:#333;">${addr}</p>
            <p style="margin:0; font-size:11px; color:#888;">${region}</p>
        </div>
        <button type="button" onclick="locationModal.resetPostcode()"
                style="font-size:12px; color:#1D3CFF; background:none; border:1px solid #1D3CFF; border-radius:6px; padding:4px 10px; cursor:pointer; white-space:nowrap;">
            재검색
        </button>
    `;

                      // wrap을 relative로
                      wrap.style.position = 'relative';
                      wrap.insertBefore(overlay, wrap.firstChild);
                  },

                  resetPostcode() {
                      const existing = document.getElementById('postcode-selected');
                      if (existing) existing.remove();
                      this.embedPostcode();
                  },

                  selectFavorite(el, lat, lng, region) {
                      document.querySelectorAll('.fav-item').forEach(item => {
                          item.dataset.selected = 'false';
                      });
                      el.dataset.selected = 'true';

                      this.selectedData = { region, lat, lng };
                      this.moveMap(lat, lng);
                      this.setConfirmEnabled(true);
                  },

                  searchAddress() {
                      const keyword = document.getElementById('address-input').value.trim();
                      if (!keyword) return;

                      const listEl = document.getElementById('search-result-list');
                      listEl.innerHTML = '<li style="display:flex;align-items:center;justify-content:center;height:60px;color:#aaa;font-size:13px;">검색 중...</li>';

                      const geocoder = new kakao.maps.services.Geocoder();

                      geocoder.addressSearch(keyword, (result, status) => {
                          listEl.innerHTML = '';

                          if (status !== kakao.maps.services.Status.OK) {
                              listEl.innerHTML = '<li class="search-result-empty">검색 결과가 없습니다</li>';
                              return;
                          }

                          result.forEach(place => {
                              const li = document.createElement('li');
                              li.className = 'search-result-item';

                              const roadAddr  = place.road_address?.address_name || '';
                              const jibunAddr = place.address?.address_name || place.address_name || '';

                              li.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:2px;">
                    <span class="result-road">${roadAddr || jibunAddr}</span>
                    ${roadAddr && jibunAddr ? `<span class="result-jibun">${jibunAddr}</span>` : ''}
                </div>
            `;
                              li.addEventListener('click', () => this.selectAddress(place));
                              listEl.appendChild(li);
                          });
                      }, { analyzeType: 'similar' });  // ← 이 옵션이 like에 가장 가까움
                  },

                  selectAddress(place) {
                      const lat = parseFloat(place.y);
                      const lng = parseFloat(place.x);

                      const addr = place.road_address
                          ? place.road_address.address_name
                          : place.address_name;

                      const region = [
                          place.road_address?.region_1depth_name || place.address?.region_1depth_name,
                          place.road_address?.region_2depth_name || place.address?.region_2depth_name,
                          place.road_address?.region_3depth_name || place.address?.region_3depth_name,
                      ].filter(Boolean).join(' ');

                      // 선택된 항목 하이라이트
                      document.querySelectorAll('#search-result-list .search-result-item').forEach(li => {
                          li.style.background = '';
                          li.style.borderLeft = '';
                      });
                      event.currentTarget.style.background = '#EEF2FF';
                      event.currentTarget.style.borderLeft = '3px solid #1D3CFF';

                      this.selectedData = { region, lat, lng };
                      this.moveMap(lat, lng);
                      this.setConfirmEnabled(true);
                  },


                  moveMap(lat, lng) {
                      const position = new kakao.maps.LatLng(lat, lng);
                      this.map.panTo(position);
                      this.marker.setPosition(position);
                      this.marker.setMap(this.map);
                  },

                  setConfirmEnabled(enabled) {
                      const btn = document.getElementById('btn-confirm-location');
                      btn.disabled = !enabled;
                      btn.style.opacity = enabled ? '1' : '0.4';
                      btn.style.cursor = enabled ? 'pointer' : 'default';
                  },

                  confirm() {
                      if (!this.selectedData) return;
                      document.getElementById('h-region').value = this.selectedData.region;
                      document.getElementById('h-lat').value    = this.selectedData.lat;
                      document.getElementById('h-lng').value    = this.selectedData.lng;
                      document.getElementById('display-region').textContent = this.selectedData.region;
                      document.getElementById('clear-region-btn').classList.remove('hidden');
                      this.close();
                  },
              };


              // onclick에서 접근할 수 있도록 전역 등록
              window.locationModal = locationModal;
          });
  </script>
</th:block>
</body>
</html>
