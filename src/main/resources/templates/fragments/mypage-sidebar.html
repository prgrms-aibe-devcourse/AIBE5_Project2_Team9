<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" class="w-full lg:w-[260px] lg:flex-shrink-0">
  <div class="bg-white border border-[#CCC] rounded-2xl p-6">

    <!-- 유저 정보 -->
    <div class="flex flex-col items-center text-center pb-5 mb-5 border-b border-[#CCC]">
      <div class="w-16 h-16 rounded-full bg-[#D3DEF2] flex items-center justify-center text-2xl mb-3">
        👤
      </div>
      <p class="text-base font-bold text-[#1A1A1A]" th:text="${member.name}">이름</p>
      <p class="text-sm text-[#888] mt-0.5" th:text="${member.email}">이메일</p>

      <!-- 캐시 잔액 -->
      <div class="mt-3 w-full rounded-xl bg-[#F9FAFC] border border-[#CCC] px-4 py-2.5 flex items-center justify-between">
        <span class="text-xs text-[#888]">캐시 잔액</span>
        <span id="sidebarCashBalance" class="text-sm font-bold text-[#1D3CFF]"
              th:text="${member.cash != null ? #numbers.formatInteger(member.cash, 1, 'COMMA') + ' C' : '0 C'}">0 C</span>
      </div>
    </div>

    <!-- 네비게이션 -->
    <nav class="space-y-1">

      <a th:href="@{/member/mypage/profile}"
         th:classappend="${activeTab == 'profile'} ? ' bg-[#F9FAFC] text-[#1D3CFF] font-semibold' : ' text-[#444] hover:bg-[#F9FAFC] hover:text-[#1D3CFF]'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors text-sm">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        내 프로필
      </a>

      <a th:href="@{/member/mypage/reservations}"
         th:classappend="${activeTab == 'reservations'} ? ' bg-[#F9FAFC] text-[#1D3CFF] font-semibold' : ' text-[#444] hover:bg-[#F9FAFC] hover:text-[#1D3CFF]'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors text-sm">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        예약 내역
      </a>

    </nav>
  </div>
</aside>

</body>
</html>
