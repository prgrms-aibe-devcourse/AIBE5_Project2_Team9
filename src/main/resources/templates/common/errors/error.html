<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(~{::title}, ~{::pageStyles}, ~{::main})}">
<head>
  <title>오류가 발생했습니다 - PICKASSO</title>
  <th:block th:fragment="pageStyles">
    <style>
        .error-page-shell {
            min-height: calc(100vh - 8rem);
            background:
                radial-gradient(circle at top left, rgba(29, 60, 255, 0.10), transparent 28rem),
                radial-gradient(circle at bottom right, rgba(0, 151, 255, 0.14), transparent 26rem);
        }
    </style>
  </th:block>
</head>
<body>
<main class="error-page-shell flex items-center justify-center px-6 py-16 -translate-y-4">
  <section class="w-full max-w-[720px] rounded-[32px] border border-[#DCE5F3] bg-white/90 px-8 pb-12 pt-6 text-center shadow-[0_20px_80px_rgba(29,60,255,0.08)] backdrop-blur-sm sm:px-12">
    <div class="mx-auto mb-6 flex h-36 w-36 items-center justify-center">
      <img th:src="@{/images/error_logo.webp}"
           alt="에러 안내 로고"
           class="h-full w-full object-contain" />
    </div>

    <p class="mb-3 text-sm font-semibold uppercase tracking-[0.35em] text-[#1D3CFF]">Error</p>
    <h1 class="mb-4 text-[32px] font-semibold leading-tight text-[#1A1A1A] sm:text-[40px]">
      예상치 못한 오류가 발생했습니다
    </h1>
    <p class="mx-auto max-w-[520px] text-[16px] leading-7 text-[#666]">
      일시적인 장애가 발생했거나 요청을 처리할 수 없습니다.<br>
      잠시 후 다시 시도해 주시기 바랍니다.
    </p>

    <div class="mt-10 flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a th:href="@{/home}"
         class="inline-flex min-w-[180px] items-center justify-center rounded-full bg-[#1D3CFF] px-6 py-3 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-[#1530E0]">
        홈으로 이동
      </a>
      <a href="javascript:history.back();"
         class="inline-flex min-w-[180px] items-center justify-center rounded-full border border-[#1D3CFF] bg-white px-6 py-3 text-[15px] font-semibold text-[#1D3CFF] no-underline transition-colors hover:bg-[#EEF4FF]">
        이전 페이지로
      </a>
    </div>
  </section>
</main>
</body>
</html>
