<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="ko">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — PICKASSO</title>

  <!-- Global Base Styles (fonts, design tokens) -->
  <link rel="stylesheet" th:href="@{/css/global.css}">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            angelica: ['WhiteAngelica', 'cursive'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-[#F9FAFC] text-[#1A1A1A] font-sans min-h-screen flex flex-col items-center justify-center px-4">

  <!-- 로그인 카드 -->
  <div class="w-full max-w-[440px]">

    <!-- 로고 -->
    <a th:href="@{/}" class="flex flex-col items-center gap-2 mb-10 no-underline">
      <img th:src="@{/images/logo.png}" alt="PICKASSO 로고" class="h-12 w-auto">
      <span class="font-angelica text-[22px] text-[#1D3CFF] tracking-wide">PICKASSO</span>
    </a>

    <!-- 회원 유형 탭 -->
    <div class="flex gap-3 mb-7">
      <button
        id="tab-user"
        type="button"
        onclick="switchTab('user')"
        class="flex-1 py-3 rounded-full border-2 border-[#1D3CFF] text-[#1D3CFF] bg-[#F9FAFC] font-semibold text-[15px] transition-colors"
      >
        일반회원
      </button>
      <button
        id="tab-photographer"
        type="button"
        onclick="switchTab('photographer')"
        class="flex-1 py-3 rounded-full border-2 border-[#CCC] text-[#888] bg-[#F9FAFC] font-semibold text-[15px] transition-colors"
      >
        작가회원
      </button>
    </div>

    <!-- 로그인 폼 -->
    <form id="login-form" th:action="@{/login}" method="post" class="flex flex-col gap-4">

      <!-- 회원 유형 hidden 필드 -->
      <input type="hidden" id="member-type" name="memberType" value="user" />

      <!-- 아이디 입력 -->
      <div>
        <input
          type="text"
          name="username"
          id="username"
          placeholder="아이디를 입력해 주세요."
          autocomplete="username"
          required
          class="w-full bg-[#F9FAFC] border border-[#CCC] rounded-lg px-4 py-3 text-[#1A1A1A] placeholder-[#AAA] text-[15px] focus:outline-none focus:border-[#0097FF] focus:ring-1 focus:ring-[#0097FF]"
        />
      </div>

      <!-- 비밀번호 입력 -->
      <div>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="비밀번호를 입력해 주세요."
          autocomplete="current-password"
          required
          class="w-full bg-[#F9FAFC] border border-[#CCC] rounded-lg px-4 py-3 text-[#1A1A1A] placeholder-[#AAA] text-[15px] focus:outline-none focus:border-[#0097FF] focus:ring-1 focus:ring-[#0097FF]"
        />
      </div>

      <!-- 오류 메시지 -->
      <p th:if="${param.error}" class="text-sm text-red-500 text-center -mt-1">
        아이디 또는 비밀번호가 올바르지 않습니다.
      </p>

      <!-- 아이디/비밀번호 찾기 -->
      <div class="text-right -mt-1">
        <a th:href="@{/find-account}" class="text-sm text-[#888] hover:text-[#1D3CFF] transition-colors no-underline">
          아이디/비밀번호 찾기
        </a>
      </div>

      <!-- 로그인 버튼 -->
      <button
        type="submit"
        class="w-full py-3.5 rounded-full bg-[#1D3CFF] text-white font-semibold text-[16px] hover:bg-[#1530E0] active:bg-[#1020C0] transition-colors mt-1"
      >
        로그인
      </button>

    </form>

    <!-- 카카오 로그인 -->
    <div class="mt-3">
      <a
        th:href="@{/oauth2/authorization/kakao}"
        class="flex items-center justify-center gap-2 w-full py-3.5 rounded-full bg-[#FEE500] text-[#1A1A1A] font-semibold text-[16px] hover:bg-[#F0D800] active:bg-[#E0C900] transition-colors no-underline"
      >
        <!-- 카카오 말풍선 아이콘 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5 fill-[#1A1A1A]">
          <path d="M12 3C6.477 3 2 6.589 2 11c0 2.764 1.708 5.19 4.3 6.686L5.4 21l4.14-2.27A11.56 11.56 0 0 0 12 19c5.523 0 10-3.589 10-8S17.523 3 12 3z"/>
        </svg>
        카카오로 시작하기
      </a>
    </div>

    <!-- 회원가입 안내 -->
    <p class="text-center text-sm text-[#888] mt-8">
      아직 PICKASSO 회원이 아니신가요?
      <a th:href="@{/signup}" class="text-[#1D3CFF] font-semibold hover:underline no-underline ml-1">
        회원가입
      </a>
    </p>

  </div>

  <script>
    function switchTab(type) {
      const tabUser = document.getElementById('tab-user');
      const tabPhotographer = document.getElementById('tab-photographer');
      const memberTypeInput = document.getElementById('member-type');

      if (type === 'user') {
        tabUser.classList.remove('border-[#CCC]', 'text-[#888]');
        tabUser.classList.add('border-[#1D3CFF]', 'text-[#1D3CFF]');
        tabPhotographer.classList.remove('border-[#1D3CFF]', 'text-[#1D3CFF]');
        tabPhotographer.classList.add('border-[#CCC]', 'text-[#888]');
        memberTypeInput.value = 'user';
      } else {
        tabPhotographer.classList.remove('border-[#CCC]', 'text-[#888]');
        tabPhotographer.classList.add('border-[#1D3CFF]', 'text-[#1D3CFF]');
        tabUser.classList.remove('border-[#1D3CFF]', 'text-[#1D3CFF]');
        tabUser.classList.add('border-[#CCC]', 'text-[#888]');
        memberTypeInput.value = 'photographer';
      }
    }
  </script>

</body>
</html>
